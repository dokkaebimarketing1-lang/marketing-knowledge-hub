term: "나노·마이크로 인플루언서"
definition: "팔로워 1천~1만(나노), 1만~10만(마이크로) 규모의 인플루언서. 메가 인플루언서보다 팔로워와의 관계가 밀접해
  참여율·신뢰도·전환율이 높은 편이다. 예: 3만 팔로워 뷰티 크리에이터에게 체험단 콘텐츠 의뢰."
aliases:
