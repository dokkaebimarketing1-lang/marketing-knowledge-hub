term: "뮤즈"
definition: "브랜드가 제품·캠페인의 얼굴로 선정한 특정 인물(연예인, 인플루언서, 모델 등). 뮤즈는 브랜드 이미지와 감성을 대표하는
  역할을 한다. 예: 화장품 브랜드가 아이돌을 뮤즈로 발탁해 광고 캠페인 진행."
