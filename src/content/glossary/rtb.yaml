term: "RTB"
definition: "광고 노출이 발생하는 순간 입찰가에 따라 광고가 실시간으로 낙찰되는 디지털 광고 거래 방식(Real-Time
  Bidding). 예: 사용자가 페이지를 열 때 수십 ms 내에 가장 높은 입찰가의 광고가 노출됨."
aliases:
