term: "랜딩페이지"
definition: "광고·검색 등으로 사용자가 처음 도착하는 단일 목적의 페이지(Landing Page). 전환(가입·구매·문의)에
  최적화되어 있으며 CTA가 핵심 요소다. 예: 신제품 프로모션 광고를 클릭하면 도착하는 이벤트 페이지."
