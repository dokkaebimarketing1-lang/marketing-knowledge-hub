term: "CPS"
definition: "실제 판매(매출) 1건당 발생하는 비용(Cost Per Sale). 제휴·퍼포먼스 마케팅에서 성과 기준으로 쓰인다. 예:
  판매 1건당 15% 수수료 = CPS 방식 제휴 마케팅."
