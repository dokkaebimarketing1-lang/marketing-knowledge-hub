term: "eCPM"
definition: "실제 성과(클릭·설치·매출) 기준으로 환산한 1,000회 노출당 비용(Effective Cost Per Mille).
  매체·네트워크의 수익 효율 비교에 사용된다. 예: 1,000회 노출로 5건의 클릭이 발생해 eCPM이 산출됨."
aliases:
