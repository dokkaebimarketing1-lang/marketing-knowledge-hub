term: "브랜드 자산"
definition: "브랜드 인지도·충성도·연상 등 브랜드가 지닌 무형의 가치(Brand Equity). 마케팅 효율과 가격 프리미엄에 영향을
  준다. 예: 명품 브랜드가 같은 품질의 무명 브랜드보다 높은 가격을 받을 수 있는 이유."
