term: "퍼포먼스 마케팅"
definition: "전환·클릭·설치 등 측정 가능한 성과(KPI)를 기준으로 운영·최적화하는 마케팅(Performance
  Marketing). 광고비가 성과에 연동되는 경우가 많다. 예: ROAS 400% 달성을 목표로 검색 광고를 최적화."
