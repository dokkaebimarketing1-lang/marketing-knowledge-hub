term: "도달"
definition: "콘텐츠·광고를 본 고유 사용자 수. 노출(Impressions)이 노출 횟수라면 도달은 고유 사용자 기준이다. 예: 릴스
  도달 10만 회 = 10만 명이 콘텐츠를 봄."
