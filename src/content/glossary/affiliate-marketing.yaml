term: "제휴 마케팅"
definition: "제휴 파트너(블로거, 인플루언서 등)가 상품을 홍보하고 실제 판매·성과가 발생하면 수수료를 지급하는
  마케팅(어필리에이트). 예: 리뷰 블로거가 링크로 발생한 판매의 10%를 수수료로 수령."
