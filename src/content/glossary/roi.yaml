term: "ROI"
definition: "투자 대비 순이익의 비율(Return On Investment). ROI = (순이익 ÷ 투자비용) × 100.
  ROAS가 매출 기준이라면 ROI는 이익 기준으로, 원가·비용을 반영한다. 예: 100만 원 투자로 순이익 150만 원 → ROI
  150%."
