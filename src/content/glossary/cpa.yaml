term: "CPA"
definition: "전환·획득(가입, 구매, 설치 등) 1건당 지불하는 비용(Cost Per Acquisition). CPA = 광고비 ÷
  획득 수. 예: 100만 원 광고비로 50건 가입 → CPA 2만 원."
aliases:
