term: "바이럴 마케팅"
definition: "소비자가 자발적으로 메시지·콘텐츠를 공유해 확산시키도록 유도하는 마케팅. 입소문·공유를 통해 도달 범위가 기하급수적으로
  늘어나는 것이 특징이다. 예: 재미있는 밈(meme) 형식의 광고가 SNS에서 대량 공유됨."
