term: "이탈률"
definition: "참여하지 않은 세션의 비율(Bounce Rate). GA4에서는 100% − 참여율로 정의되며, UA 대비 낮게 측정되는
  경향이 있다. 예: 참여율 60%면 이탈률 40%."
