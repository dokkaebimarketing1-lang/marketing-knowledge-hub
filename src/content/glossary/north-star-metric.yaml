term: "북극성 지표"
definition: "제품·서비스 성장의 최종 목표가 되는 단일 지표(North Star Metric, NSM). 모든 팀의 노력을 한곳으로
  모으는 역할을 한다. 예: 음악 앱의 \"주간 청취 시간\", SNS의 \"주간 활성 사용자\"."
