term: "GEO"
definition: "생성형 AI 엔진(ChatGPT, Perplexity, Google AI Overviews 등)이 답변을 생성할 때
  브랜드·콘텐츠를 인용·추천하도록 구조화하는 최적화. SEO가 '클릭을 위한 순위'라면 GEO는 'AI 답변에서의 인용·추천'을 목표로 한다.
  예: AI가 추천 화장품을 답할 때 우리 브랜드가 소스로 인용되도록 구조화된 FAQ·데이터를 제공."
